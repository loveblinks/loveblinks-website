<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Love Memory Puzzle</title>
<style>
body{background:#0f0f0f;color:#fff;font-family:sans-serif;text-align:center;padding:15px;margin:0}
h1{color:#ff4d8d;margin-top:10px}
#board{display:grid;grid-template-columns:repeat(4,75px);gap:12px;justify-content:center;margin:25px auto}
.card{width:75px;height:75px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,0.3);color:#000}
.card.open{background:#ff4d8d;color:#fff}
#moves{font-size:18px;margin-top:10px}
</style>
</head>
<body>
<h1>💖 Memory Puzzle 💖</h1>
<p>Same emoji wale 2 cards dhoondo!</p>
<div id="board"></div>
<p id="moves">Moves: 0</p>
<script>
const emojis=['😍','😍','🥰','🥰','😘','😘','💖','💖','💘','💘','💝','💝','🌹','🌹','💋','💋'];
emojis.sort(()=>Math.random()-0.5);
const board=document.getElementById('board');
let first=null,lock=false,moves=0;
emojis.forEach(e=>{
 let d=document.createElement('div');
 d.className='card';
 d.innerHTML='?';
 d.dataset.emoji=e;
 d.onclick=()=>{
  if(lock||d.classList.contains('open'))return;
  d.innerHTML=e;
  d.classList.add('open');
  if(!first){first=d}
  else{
   moves++;
   document.getElementById('moves').innerText='Moves: '+moves;
   if(first.dataset.emoji===e){
    first=null;
    if(document.querySelectorAll('.open').length===16){setTimeout(()=>alert('You Won in '+moves+' moves! 💖'),300)}
   } else {
    lock=true;
    setTimeout(()=>{
     d.innerHTML='?';first.innerHTML='?';
     d.classList.remove('open');first.classList.remove('open');
     first=null;lock=false;
    },700);
   }
  }
 };
 board.appendChild(d);
});
</script>
</body>
</html>
